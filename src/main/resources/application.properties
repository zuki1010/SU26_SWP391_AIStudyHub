spring.application.name=SU26_SWP391_AIStudyHub

server.port=${PORT:8080}

# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# ===================================================================
# AWS AUTOCONFIG OFF
# ===================================================================
spring.cloud.aws.s3.enabled=false
spring.cloud.aws.region.auto=false
spring.cloud.aws.credentials.instance-profile=false

# ===================================================================
# JWT
# ===================================================================
app.jwt.secret=${JWT_SECRET:ChangeMeInDeployEnvironmentMustBeAtLeast256BitsLongForHS256!!}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:604800000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
app.jwt.reset-expiration-ms=${JWT_RESET_EXPIRATION_MS:3600000}

# ===================================================================
# FRONTEND / CORS
# ===================================================================
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.frontend.reset-password-url=${APP_FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# ===================================================================
# SWAGGER
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# SUPABASE STORAGE
# ===================================================================
supabase.url=${SUPABASE_URL:}
supabase.bucket-name=${SUPABASE_BUCKET_NAME:documents}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

spring.cloud.aws.credentials.access-key=${SUPABASE_S3_ACCESS_KEY:}
spring.cloud.aws.credentials.secret-key=${SUPABASE_S3_SECRET_KEY:}
spring.cloud.aws.region.static=${SUPABASE_S3_REGION:ap-southeast-1}
spring.cloud.aws.s3.endpoint=${SUPABASE_S3_ENDPOINT:}

# ===================================================================
# GEMINI
# ===================================================================
gemini.api.key=${GEMINI_API_KEY:}

# ===================================================================
# UPLOAD CONFIG
# ===================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:120MB}

server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=${MAX_FORM_POST_SIZE:120MB}

# ===================================================================
# MAIL
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:noreply@aistudyhub.local}}

# ===================================================================
# TECHCOMBANK QR PAYMENT
# ===================================================================
payment.bank-code=TCB
payment.bank-name=Techcombank
payment.account-number=19038500362012
payment.account-name=NGUYEN CHI CUONG
payment.amount=99000
payment.display-price=99000

# ===================================================================
# ACTUATOR
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false