# ===================================================================
# TẮT XUNG ĐỘT AWS S3 AUTOCONFIGURATION (QUAN TRỌNG)
# ===================================================================
spring.cloud.aws.s3.enabled=false
spring.cloud.aws.region.auto=false
spring.cloud.aws.credentials.instance-profile=false

# ===================================================================
# THÔNG TIN XÁC THỰC VÀ BẢO MẬT
# ===================================================================
spring.thymeleaf.check-template-location=false
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

app.jwt.secret=ChangeMeInApplicationLocalPropertiesMustBeAtLeast256BitsLongForHS256!!
app.jwt.access-expiration-ms=604800000
app.jwt.refresh-expiration-ms=604800000
app.jwt.reset-expiration-ms=3600000

app.frontend.reset-password-url=http://localhost:5173/reset-password
app.mail.from=noreply@aistudyhub.local

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===================================================================
# CONFIGURATION FOR CLOUD STORAGE (SUPABASE REST API)
# ===================================================================
# URL gốc lấy từ project của bạn (khớp với endpoint datasource)
supabase.url=${VITE_SUPABASE_URL}
supabase.bucket-name=documents

# Sửa lại để map chuẩn xác với key trong file .env của nhóm bạn
supabase.anon-key=${supabase.anon-key}
supabase.service-role-key=${supabase.service-role-key}

# Đọc key Gemini chuẩn chỉnh (xóa dấu cách thừa sau dấu bằng)
gemini.api.key=${GEMINI_API_KEY}


# Upload file size config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB

# Tomcat config for large multipart request
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=60MB


